name: Flutter CI

on:
  push:
    branches:
      - main
      - develop
      - staging
      - feature/enstso
    
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout
        uses: actions/checkout@v4

      # Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
     
      # Install dependencies
      - name: Flutter pub get
        run: flutter pub get

      # Generate mock files (if using mockito with @GenerateMocks)
      - name: Build runner (generate mocks)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      # Run tests
      - name: Run Flutter tests
        run: flutter test
